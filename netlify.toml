# اهلا — Ahlan platform (single-file app)
# Netlify builds the publish folder from the single source file.
[build]
  publish = "dist"
  command = "mkdir -p dist && cp ahlan.html dist/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
