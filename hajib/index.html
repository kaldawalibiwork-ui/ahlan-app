<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="الحاجب المنصور القانوني — لوحة واحدة للقضايا والجلسات والوكالات والتنفيذ والمخالفات، مع السكرتير القانوني والتقارير">
<meta name="theme-color" content="#123d2f">
<meta name="referrer" content="no-referrer">
<title>الحاجب المنصور القانوني</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c9a24a'/%3E%3Cpath d='M32 14v34M20 48h24M14 24h36M14 24l-6 14h12zM50 24l-6 14h12z' stroke='%23123d2f' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="xlsx.full.min.js" defer></script>
<style>
:root{
  --pri:#123d2f; --pri-2:#1b5442; --gold:#c9a24a; --gold-2:#b08a35; --gold-soft:#f6eedb;
  --bg:#f3f1ec; --card:#fff; --line:#e3e0d8; --ink:#1d2622; --muted:#66706b;
  --ok:#2e7d5b; --ok-soft:#e5f3ec; --warn:#b7791f; --warn-soft:#fbf1df; --bad:#b23b3b; --bad-soft:#fbe9e9;
  --info:#2f5f9e; --info-soft:#e7eef8; --shadow:0 4px 18px rgba(18,61,47,.08); --r:14px;
}
:root[data-theme="dark"]{
  --pri:#0e2f24; --pri-2:#174636; --gold:#d6b25c; --gold-2:#c9a24a; --gold-soft:#3a3220;
  --bg:#0d1714; --card:#15231e; --line:#26392f; --ink:#e7eee9; --muted:#9fb1a8;
  --ok-soft:#173428; --warn-soft:#3a2f18; --bad-soft:#3a1f1f; --info-soft:#1b2a3d; --shadow:0 4px 18px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pri:#0e2f24; --pri-2:#174636; --gold:#d6b25c; --gold-2:#c9a24a; --gold-soft:#3a3220;
    --bg:#0d1714; --card:#15231e; --line:#26392f; --ink:#e7eee9; --muted:#9fb1a8;
    --ok-soft:#173428; --warn-soft:#3a2f18; --bad-soft:#3a1f1f; --info-soft:#1b2a3d; --shadow:0 4px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-2)}
.hidden{display:none!important}
.muted{color:var(--muted)} .sm{font-size:.82rem} .b{font-weight:700}
/* top */
.top{background:var(--pri);color:#fff;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:.68rem;color:var(--gold);letter-spacing:.5px}
.portals{display:flex;gap:6px;flex-wrap:wrap}
.portal{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;border-radius:9px;padding:4px 10px;font-size:.78rem;line-height:1.3}
.portal small{display:block;color:#b9cbc2;font-size:.66rem}
.portal:hover{background:rgba(255,255,255,.16)}
.portal.gold{background:var(--gold);color:var(--pri);border-color:var(--gold)} .portal.gold small{color:var(--pri)}
.sp{flex:1}
.gsearch{position:relative;min-width:200px;flex:0 1 280px}
.gsearch input{width:100%;border:none;border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.12);color:#fff}
.gsearch input::placeholder{color:#b9cbc2}
.gres{position:absolute;top:110%;inset-inline:0;background:var(--card);color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:360px;overflow:auto;z-index:60}
.gres div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.gres div:hover{background:var(--gold-soft)}
.ibtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;position:relative}
.ibtn:hover{background:rgba(255,255,255,.2)}
.dot-n{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--gold);color:var(--pri);border-radius:20px;font-size:.68rem;padding:0 6px;font-weight:800}
.tool-row{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap;align-items:center}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tbtn.gold{background:var(--gold);color:var(--pri);border-color:var(--gold);font-weight:700}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;position:sticky;z-index:30;scrollbar-width:thin}
.nav button{border:none;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.nav button.on{background:var(--pri);color:#fff}
.nav button:hover:not(.on){background:var(--gold-soft);color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:1.35rem;margin:0}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border-inline-start:5px solid var(--pri)}
.kpi b{display:block;font-size:1.6rem;line-height:1.2}
.kpi span{color:var(--muted);font-size:.82rem}
.kpi.g{border-inline-start-color:var(--gold)} .kpi.r{border-inline-start-color:var(--bad)} .kpi.o{border-inline-start-color:var(--warn)} .kpi.i{border-inline-start-color:var(--info)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card+.card{margin-top:14px}
.card h3{margin:0 0 10px;font-size:1.02rem}
/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--pri)}
.btn.d{color:var(--bad)} .btn.d:hover{border-color:var(--bad)}
.btn.s{padding:4px 9px;font-size:.8rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;padding:6px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px}
.filters input[type=search]{flex:1;min-width:180px}
/* pills */
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:.74rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)} .p-mut{background:var(--bg);color:var(--muted);border-color:var(--line)} .p-gold{background:var(--gold-soft);color:var(--gold-2)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{background:var(--pri);color:#fff;text-align:start;padding:9px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:var(--gold-soft)}
table.t tr.click{cursor:pointer}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* week */
.week{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(170px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.wcol{border-inline-start:1px solid var(--line);min-height:260px;display:flex;flex-direction:column}
.wcol:first-child{border-inline-start:none}
.whead{background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:6px}
.whead.today{background:var(--gold-soft)}
.whead b{display:block} .whead .sm{line-height:1.3}
.wbody{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.sess{border:1px solid var(--line);border-inline-start:4px solid var(--info);border-radius:10px;padding:8px;cursor:pointer;background:var(--card);font-size:.82rem}
.sess:hover{border-color:var(--gold)}
.sess.held{border-inline-start-color:var(--ok)} .sess.ended{border-inline-start-color:var(--muted)} .sess.ev{border-inline-start-color:var(--gold)}
.sess .tm{font-weight:800;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.cnt{background:var(--pri);color:#fff;border-radius:20px;padding:0 8px;font-size:.75rem;font-weight:700}
/* client tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.av{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2rem}
/* modal */
#modals .ov{position:fixed;inset:0;background:rgba(6,20,15,.55);display:grid;place-items:center;padding:14px;z-index:100}
.md{background:var(--card);border-radius:16px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--line)}
.md.lg{max-width:980px}
.md-h{background:var(--pri);color:#fff;padding:13px 16px;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:8px}
.md-h .x{margin-inline-start:auto;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}
.md-b{padding:16px;overflow:auto}
.md-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fd label{display:block;font-weight:600;font-size:.84rem;margin-bottom:4px}
.fd input,.fd select,.fd textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
.fd textarea{min-height:76px;resize:vertical}
.fd.full{grid-column:1/-1}
.fd .hint{color:var(--muted);font-size:.76rem;margin-top:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-4px 0 12px;padding-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.84rem}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.kv span{display:block;color:var(--muted);font-size:.74rem}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line)}
.banner.w{background:var(--warn-soft);border-color:#ecd6a8} .banner.i{background:var(--info-soft)} .banner.r{background:var(--bad-soft)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px}
.msg{padding:9px 12px;border-radius:12px;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--pri);color:#fff;align-self:flex-start}
.msg.a{background:var(--bg);border:1px solid var(--line);align-self:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:.8rem}
.chip:hover{border-color:var(--gold)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--gold);color:var(--gold-2)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--pri);color:#fff;padding:9px 16px;border-radius:11px;box-shadow:var(--shadow);font-weight:600}
.toast.ok{background:var(--ok)} .toast.err{background:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.top{position:static}.portal small{display:none}.portal{padding:3px 8px}.tool-row .tbtn{padding:4px 8px;font-size:.8rem}.gsearch{flex:1 1 100%}.grid2,.fg{grid-template-columns:1fr}.brand small{display:none}.week{grid-template-columns:1fr}.wcol{border-inline-start:none;border-top:1px solid var(--line);min-height:auto}}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:20px}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#c9a24a"/><path d="M32 14v34M20 48h24M14 24h36M14 24l-6 14h12zM50 24l-6 14h12z" stroke="#123d2f" stroke-width="3" fill="none" stroke-linejoin="round"/></svg>
      <div>الحاجب المنصور القانوني<small id="brandSub">سكرتير المحامي</small></div>
    </div>
    <nav class="portals" id="portals"></nav>
    <span class="sp"></span>
    <div class="gsearch"><input id="gq" placeholder="ابحث برقم القضية أو اسم الطرف أو الموكل..." autocomplete="off"><div class="gres hidden" id="gres"></div></div>
  </div>
  <div class="tool-row">
    <span class="sm" style="color:#b9cbc2" id="lastSave">—</span>
    <span class="sp"></span>
    <button class="tbtn" data-act="go" data-v="assistant">✨ المساعد القانوني</button>
    <button class="tbtn" data-act="go" data-v="secretary">🗓 السكرتير</button>
    <button class="tbtn" data-act="exportICS" title="أضف الجلسات والمواعيد لتقويم جوالك مع التنبيهات">📅 تصدير للتقويم</button>
    <button class="tbtn gold" data-act="openImport">⬆ استيراد من Excel</button>
    <button class="ibtn" data-act="alerts" title="التنبيهات">🔔<span class="dot-n hidden" id="alertN"></span></button>
    <button class="ibtn" data-act="theme" title="الوضع الليلي">🌓</button>
    <button class="ibtn" data-act="settings" title="الإعدادات">⚙</button>
  </div>
</header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
<footer>الحاجب المنصور القانوني — بياناتك محفوظة على جهازك فقط. أداة مساعدة لا تحل محل المنصات الرسمية؛ راجع البيانات قبل أي إجراء نظامي.</footer>

<script>
"use strict";
/* ======================================================================
   الحاجب المنصور القانوني — تطبيق ويب في ملف واحد
   التخزين: IndexedDB (بيانات + مستندات) مع قفل وتشفير اختياري AES-GCM
   ====================================================================== */

/* ---------------- IndexedDB ---------------- */
const DB_NAME="hajib_db";let _db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=e=>{const d=e.target.result;["kv","files"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s);});};
  r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=()=>rej(r.error);});}
const idb=(store,mode,fn)=>new Promise((res,rej)=>{const q=fn(_db.transaction(store,mode).objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const idbGet=(s,k)=>idb(s,"readonly",o=>o.get(k));
const idbSet=(s,k,v)=>idb(s,"readwrite",o=>o.put(v,k));
const idbDel=(s,k)=>idb(s,"readwrite",o=>o.delete(k));
const idbKeys=s=>idb(s,"readonly",o=>o.getAllKeys());

/* ---------------- Crypto ---------------- */
let KEY=null;
const b64={enc:b=>{const u=new Uint8Array(b);let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);},
  dec:s=>{const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}};
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64.dec(salt),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function encObj(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(o)));return{enc:true,iv:b64.enc(iv),ct:b64.enc(ct)};}
async function decObj(k,w){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(w.iv)},k,b64.dec(w.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function encBlob(k,blob){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,await blob.arrayBuffer());return{enc:true,iv:b64.enc(iv),ct:b64.enc(ct),type:blob.type};}
async function decBlob(k,w){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(w.iv)},k,b64.dec(w.ct));return new Blob([pt],{type:w.type||""});}
async function putFile(id,blob){await idbSet("files",id,KEY?await encBlob(KEY,blob):blob);}
async function getFile(id){const v=await idbGet("files",id);if(!v)return null;if(v.enc){if(!KEY)throw new Error("locked");return decBlob(KEY,v);}return v;}

/* ---------------- State ---------------- */
const DEF_SETTINGS={office:"",lawyer:"",remindMins:"30,10",appealDays:30,violP1:60,violP2:60,calcUrl:"",minutesUrl:"",apiKey:"",model:"claude-sonnet-5-5",notify:false,letterhead:true};
let S={clients:[],cases:[],poas:[],execs:[],viols:[],events:[],laws:[],changes:[],settings:{...DEF_SETTINGS}};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await idbSet("kv","state",KEY?await encObj(KEY,S):S);
  $("#lastSave").textContent="آخر حفظ: "+new Date().toLocaleTimeString("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit"});}catch(e){toast("تعذّر الحفظ: "+e.message,"err");}},200);}
async function load(){let s=await idbGet("kv","state");if(s&&s.enc)s=await decObj(KEY,s);
  if(s&&s.cases){S=Object.assign({clients:[],cases:[],poas:[],execs:[],viols:[],events:[],laws:[],changes:[]},s);S.settings={...DEF_SETTINGS,...(s.settings||{})};}}
function logChange(text,ref){S.changes.unshift({id:uid(),at:new Date().toISOString(),text,ref:ref||null,read:false});if(S.changes.length>500)S.changes.length=500;}

/* ---------------- Utils ---------------- */
const $=(q,r=document)=>r.querySelector(q);
const $$=(q,r=document)=>[...r.querySelectorAll(q)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(String(v==null?"":v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d.\-]/g,""));return isNaN(n)?0:n;};
const money=v=>num(v).toLocaleString("en-US")+" ر.س";
const pad=n=>String(n).padStart(2,"0");
const isoD=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>isoD(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+Number(n));return isoD(d);};
const dt=(date,time)=>new Date((date||todayISO())+"T"+(time||"00:00")+":00");
function daysTo(iso){if(!iso)return null;const a=new Date(iso+"T00:00:00"),b=new Date(todayISO()+"T00:00:00");return Math.round((a-b)/864e5);}
const FG=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"long",year:"numeric"});
const FH=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"});
const FHs=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long"});
const FW=new Intl.DateTimeFormat("ar-SA",{weekday:"long"});
const gD=iso=>iso?FG.format(new Date(iso+"T12:00:00")):"—";
const hD=iso=>iso?FH.format(new Date(iso+"T12:00:00")):"—";
const wD=iso=>iso?FW.format(new Date(iso+"T12:00:00")):"";
const both=iso=>iso?`${wD(iso)} ${hD(iso)} — ${gD(iso)}`:"—";
function tm(t){if(!t)return"";let[h,m]=t.split(":").map(Number);const p=h<12?"ص":"م";h=h%12||12;return h+":"+pad(m)+" "+p;}
function initials(n){const p=String(n||"؟").trim().split(/\s+/);return(p[0]||"")[0]+((p[1]||"")[0]||"");}
const PAL=["#123d2f","#7a4b2b","#2f5f9e","#5a3d6b","#8a2d3b","#3a6b4f","#846017","#255e70"];
const colorOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];};
function toast(m,k=""){const e=document.createElement("div");e.className="toast "+k;e.textContent=m;$("#toasts").appendChild(e);setTimeout(()=>e.remove(),2800);}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}

/* ---------------- Derived ---------------- */
function allSessions(){const out=[];S.cases.forEach(c=>(c.sessions||[]).forEach(s=>out.push({...s,caseId:c.id,c})));return out.sort((a,b)=>dt(a.date,a.time)-dt(b.date,b.time));}
function nextSession(c){const t=todayISO();return(c.sessions||[]).filter(s=>s.date>=t&&s.status!=="ended").sort((a,b)=>dt(a.date,a.time)-dt(b.date,b.time))[0]||null;}
function lastSession(c){const t=todayISO();return(c.sessions||[]).filter(s=>s.date<t).sort((a,b)=>dt(b.date,b.time)-dt(a.date,a.time))[0]||null;}
function priority(c){const n=nextSession(c);const d=n?daysTo(n.date):null;if(d!=null&&d<=3)return["عاجل","p-bad",0];if(d!=null&&d<=14)return["متابعة","p-warn",1];return["مستقر","p-ok",2];}
function appealInfo(j){const base=j.received||j.date;if(!base)return null;const days=Number(j.appealDays||S.settings.appealDays||30);const end=addDays(base,days);return{end,left:daysTo(end)};}
function violDeadlines(v){if(!v.date)return null;const p1=addDays(v.date,S.settings.violP1),p2=addDays(p1,S.settings.violP2);const l1=daysTo(p1),l2=daysTo(p2);
  let action,left,cls;if(v.status==="paid"){action="مسددة — لا إجراء";left=null;cls="p-ok";}
  else if(l1>=0){action="تقديم تظلم أمام الجهة المصدرة";left=l1;cls=l1<=7?"p-bad":"p-info";}
  else if(l2>=0){action="التظلم أمام ديوان المظالم قبل انتهاء المهلة";left=l2;cls=l2<=7?"p-bad":"p-warn";}
  else{action="انتهت المهل — مراجعة قانونية";left=null;cls="p-mut";}
  return{p1,p2,l1,l2,action,left,cls};}
function alertsList(){const out=[];const now=new Date();
  allSessions().forEach(s=>{if(s.status==="ended")return;const ms=dt(s.date,s.time)-now;if(ms>0&&ms<=36e5*48)out.push({t:"جلسة",txt:`${s.kind||"جلسة"} — قضية ${s.c.no||""} — ${both(s.date)} ${tm(s.time)}`,act:"case",id:s.caseId});});
  S.events.forEach(e=>{if(e.done)return;const ms=dt(e.date,e.time)-now;if(ms>-36e5&&ms<=36e5*48)out.push({t:"موعد",txt:`${e.title} — ${both(e.date)} ${tm(e.time)}`,act:"go",v:"secretary"});});
  S.poas.forEach(p=>{const d=daysTo(p.expires);if(d!=null&&d>=0&&d<=30)out.push({t:"وكالة",txt:`الوكالة ${p.no||""} (${clientName(p.clientId)}) تنتهي خلال ${d} يوم`,act:"go",v:"poas"});});
  S.cases.forEach(c=>(c.judgments||[]).forEach(j=>{const a=appealInfo(j);if(a&&a.left>=0&&a.left<=10&&!j.appealed)out.push({t:"مهلة اعتراض",txt:`حكم القضية ${c.no||""}: تنتهي مهلة الاعتراض خلال ${a.left} يوم (${gD(a.end)})`,act:"case",id:c.id});}));
  S.viols.forEach(v=>{const d=violDeadlines(v);if(d&&d.left!=null&&d.left<=7)out.push({t:"مخالفة",txt:`${v.entity}: ${d.action} — متبقٍ ${d.left} يوم`,act:"go",v:"viol_"+v.src});});
  const nv=S.viols.filter(v=>v.isNew).length;if(nv)out.push({t:"جديد",txt:`${nv} مخالفة جديدة لم تُراجَع`,act:"go",v:"viol_efaa"});
  return out;}

function fieldHTML(f,v){const val=v==null?(f.def==null?"":f.def):v;const id="f_"+f.k;let inp;
  if(f.t==="select")inp=`<select id="${id}">${f.opts.map(o=>{const[k,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(k)}" ${String(k)===String(val)?"selected":""}>${esc(l)}</option>`;}).join("")}</select>`;
  else if(f.t==="textarea")inp=`<textarea id="${id}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea>`;
  else if(f.t==="check")return`<div class="fd ${f.full?"full":""}"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="${id}" ${val?"checked":""} style="width:auto"> ${esc(f.l)}</label></div>`;
  else if(f.t==="client")inp=`<input id="${id}" list="dl_clients" value="${esc(clientName(val)||val||"")}" placeholder="اكتب اسم الموكل أو اختره"><datalist id="dl_clients">${S.clients.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist>`;
  else inp=`<input id="${id}" type="${f.t||"text"}" value="${esc(val)}" placeholder="${esc(f.ph||"")}" ${f.t==="number"?'step="any"':""}>`;
  return`<div class="fd ${f.full?"full":""}"><label>${esc(f.l)}${f.req?" *":""}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;}
function resolveClient(name){name=String(name||"").trim();if(!name)return"";let c=S.clients.find(x=>x.name===name);
  if(!c){c={id:uid(),name,type:"فرد",phone:"",email:"",idno:"",notes:""};S.clients.push(c);logChange("أُضيف موكل جديد: "+name);}return c.id;}
function readForm(ov,fields){const o={};for(const f of fields){const el=ov.querySelector("#f_"+f.k);if(!el)continue;
  let v=f.t==="check"?el.checked:el.value.trim();if(f.t==="number")v=v===""?"":num(v);if(f.t==="client")v=resolveClient(v);o[f.k]=v;}
  for(const f of fields)if(f.req&&(o[f.k]===""||o[f.k]==null)){toast("الحقل «"+f.l+"» مطلوب","err");return null;}return o;}
function formModal(title,fields,obj,onSave,{extraFoot=""}={}){
  modal(title,`<div class="fg">${fields.map(f=>fieldHTML(f,obj?obj[f.k]:undefined)).join("")}</div>`,{
    foot:`<button class="btn g" data-role="save">حفظ</button><button class="btn" data-role="cancel">إلغاء</button>${extraFoot}`,
    onMount:(ov,close)=>{ov.querySelector('[data-role=cancel]').onclick=close;
      ov.querySelector('[data-role=save]').onclick=()=>{const v=readForm(ov,fields);if(!v)return;if(onSave(v,close)!==false){close();save();refresh();toast("تم الحفظ","ok");}};}});}

  const days=[...Array(7)].map((_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return isoD(d);});

    return[...ss,...ev].sort((a,b)=>(a.time||"").localeCompare(b.time||""));};
  let shown=days.slice(0,5);days.slice(5).forEach(d=>{if(items(d).length)shown.push(d);});
  const weekCount=days.reduce((n,d)=>n+allSessions().filter(s=>s.date===d).length,0);
  const k={today:allSessions().filter(s=>s.date===t).length,week:weekCount,open:S.cases.filter(c=>c.status==="open").length,
    closed:S.cases.filter(c=>c.status!=="open").length,poa:S.poas.filter(p=>{const d=daysTo(p.expires);return d!=null&&d>=0&&d<=30;}).length,
    ex:S.execs.filter(e=>e.status==="active"||e.status==="waiting").length};
  $("#app").innerHTML=`

    <div class="kpi"><b>${k.open}</b><span>قضايا قيد النظر</span></div><div class="kpi"><b>${k.closed}</b><span>قضايا منتهية / صدر فيها حكم</span></div>
    <div class="kpi g"><b>${k.poa}</b><span>وكالات تنتهي خلال ٣٠ يومًا</span></div><div class="kpi o"><b>${k.ex}</b><span>طلبات تنفيذ قائمة</span></div>
  </div>
  <div class="card">
    <div class="head"><div><h1>${R.week===0?"هذا الأسبوع":R.week<0?"أسبوع سابق":"أسبوع قادم"} — ${k.week} جلسات</h1>
      <div class="muted sm">${hD(days[0])} ← ${hD(days[6])} · ${gD(days[0])} ← ${gD(days[6])}</div></div><span class="sp"></span>
      <div class="seg">${[["all","الكل"],["scheduled","مجدولة"],["held","منعقدة"],["ended","منتهية"]].map(([k2,l])=>`<button class="${R.wf===k2?"on":""}" data-act="wf" data-v="${k2}">${l}</button>`).join("")}</div>
      <button class="btn" data-act="wk" data-v="-1">›</button><button class="btn" data-act="wk" data-v="0">اليوم</button><button class="btn" data-act="wk" data-v="1">‹</button>
      <button class="btn g" data-act="addSessionPick">+ جلسة</button>
    </div>
    <div class="week" style="--cols:${shown.length}">${shown.map(d=>{const it=items(d);return`<div class="wcol"><div class="whead ${d===t?"today":""}"><div><b>${wD(d)}${d===t?" (اليوم)":""}</b><div class="sm muted">${FHs.format(new Date(d+"T12:00:00"))}<br>${gD(d)}</div></div><span class="cnt">${it.length}</span></div>
      <div class="wbody">${it.length?it.map(x=>x.isS?sessCard(x):evCard(x)).join(""):'<div class="muted sm" style="text-align:center;padding:20px 0">لا جلسات</div>'}</div></div>`;}).join("")}</div>
    <div class="sm muted" style="margin-top:8px">● مجدولة &nbsp; ● منعقدة &nbsp; ● منتهية &nbsp; ● مواعيد السكرتير (ذهبي)</div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="card"><h3>🔔 تنبيهات قريبة</h3>${alertsHTML(6)}</div>
    <div class="card"><h3>الموكلون</h3><div class="tiles">${S.clients.slice(0,8).map(tileHTML).join("")}<div class="tile" data-act="addClient" style="display:grid;place-items:center;color:var(--muted)"><b style="font-size:1.6rem">＋</b>موكل جديد</div></div></div>
  </div>`;};
function sessCard(s){const c=s.c;return`<div class="sess ${s.status}" data-act="case" data-id="${c.id}" data-tab="sessions">
  <div class="tm">${tm(s.time)||"—"} ${pill(SESS_ST,s.status)}</div><div><b>قضية ${esc(c.no)}</b></div><div>${esc(s.kind||"")}</div>
  <div class="muted">${esc(c.court||"")}${c.circuit?" — "+esc(c.circuit):""}</div><div class="muted">${esc(clientName(c.clientId))}</div>
  <div style="margin-top:4px">${c.role?`<span class="pill p-mut">${esc(c.role)}</span> `:""}${s.virtual?'<span class="pill p-ok">🎥 مرئية</span>':""}</div></div>`;}
function evCard(e){return`<div class="sess ev" data-act="editEvent" data-id="${e.id}"><div class="tm">${tm(e.time)} <span class="pill p-gold">${esc(e.kind)}</span></div><div><b>${esc(e.title)}</b></div>${e.person?`<div class="muted">${esc(e.person)}</div>`:""}${e.place?`<div class="muted">📍 ${esc(e.place)}</div>`:""}</div>`;}
function alertsHTML(max=50){const a=alertsList();if(!a.length)return'<div class="empty">لا تنبيهات — كل شيء تحت السيطرة</div>';
  return a.slice(0,max).map(x=>`<div class="note" style="cursor:pointer" data-act="${x.act}" data-id="${x.id||""}" data-v="${x.v||""}"><span class="pill p-gold">${x.t}</span> ${esc(x.txt)}</div>`).join("");}
function tileHTML(c){const cs=S.cases.filter(x=>x.clientId===c.id);const up=cs.map(nextSession).filter(Boolean).length;
  return`<div class="tile" data-act="client" data-id="${c.id}"><div class="av" style="background:${colorOf(c.id)}">${esc(initials(c.name))}</div><div class="b" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</div><div class="sm muted">${esc(c.type||"")}</div>
  <div style="margin-top:6px">${cs.length?`<span class="pill p-mut">${cs.length} قضية</span> `:""}${up?`<span class="pill p-info">${up} جلسة قادمة</span>`:""}</div></div>`;}
function occursOn(e,d){if(e.date===d)return true;if(!e.repeat||e.repeat==="none"||d<e.date)return false;
  if(e.repeat==="daily")return true;if(e.repeat==="weekly")return new Date(d+"T12:00:00").getDay()===new Date(e.date+"T12:00:00").getDay();
  if(e.repeat==="monthly")return d.slice(8)===e.date.slice(8);return false;}

/* ---- Cases (najiz / muin) ---- */
VIEW.cases=()=>casesView("najiz");VIEW.muin=()=>casesView("muin");
function casesView(cat){const f=R.cf;const t=todayISO();
  let list=S.cases.filter(c=>(c.cat||"najiz")===cat);const courts=[...new Set(list.map(c=>c.court).filter(Boolean))];
  const counts={all:list.length,open:list.filter(c=>c.status==="open").length,done:list.filter(c=>c.status!=="open").length};
  if(f.q){const q=f.q.toLowerCase();list=list.filter(c=>[c.no,c.court,c.circuit,c.opponent,clientName(c.clientId),c.type,c.subject].join(" ").toLowerCase().includes(q));}
  if(f.court)list=list.filter(c=>c.court===f.court);if(f.st)list=list.filter(c=>c.status===f.st);
  if(f.ss==="up")list=list.filter(c=>nextSession(c));if(f.ss==="past")list=list.filter(c=>!nextSession(c));
  list.sort((a,b)=>priority(a)[2]-priority(b)[2]||((nextSession(a)||{date:"9"}).date).localeCompare((nextSession(b)||{date:"9"}).date));
  $("#app").innerHTML=`<div class="head"><h1>${cat==="muin"?"معين — القضايا الإدارية (ديوان المظالم)":"القضايا — ناجز"}</h1><span class="pill p-mut">${counts.all} قضية</span><span class="sp"></span>

  <div class="filters"><div class="seg">${[["","الكل "+counts.all],["open","قيد النظر "+counts.open],["judged","صدر فيها حكم"],["closed","منتهية"]].map(([k,l])=>`<button class="${f.st===k?"on":""}" data-act="cf" data-k="st" data-v="${k}">${l}</button>`).join("")}</div>
    <div class="seg">${[["all","كل الجلسات"],["up","القادمة"],["past","بلا جلسة قادمة"]].map(([k,l])=>`<button class="${f.ss===k?"on":""}" data-act="cf" data-k="ss" data-v="${k}">${l}</button>`).join("")}</div>
    <input type="search" id="cq" placeholder="رقم القضية أو الطرف أو المحكمة..." value="${esc(f.q)}">
    <select id="ccourt"><option value="">كل المحاكم (${courts.length})</option>${courts.map(c=>`<option ${f.court===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
  ${table([{l:"رقم القضية",h:c=>`<b>${esc(c.no)}</b><br><span class="pill ${priority(c)[1]}">${priority(c)[0]}</span>`},
    {l:"المحكمة / الدائرة",h:c=>`${esc(c.court||"—")}<div class="sm muted">${esc(c.circuit||"")}${c.type?" · "+esc(c.type):""}</div>`},
    {l:"الأطراف",h:c=>`${esc(clientName(c.clientId)||"—")} <span class="muted">ضد</span> ${esc(c.opponent||"—")}<div class="sm muted">صفة الموكل: ${esc(c.role||"—")}</div>`},
    {l:"حالة القضية",h:c=>pill(CASE_ST,c.status)},
    {l:"الجلسة",h:c=>{const n=nextSession(c),l=n||lastSession(c);if(!l)return'<span class="muted">—</span>';
      return`<span class="pill ${n?"p-gold":"p-mut"}">${n?"القادمة":"آخر جلسة"}</span><div>${both(l.date)}</div><div class="sm muted">${tm(l.time)} · ${esc(l.kind||"")}</div>`;}},
    {l:"",h:c=>{const n=nextSession(c);return n&&n.virtual?(n.link?`<a href="${esc(n.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🎥</a>`:"🎥"):"";}}],
    list,{click:c=>["case",c.id],empty:"لا قضايا مطابقة — أضف قضية أو استوردها من Excel"})}`;
  $("#cq").oninput=e=>{R.cf.q=e.target.value;const pos=e.target.selectionStart;casesView(cat);const n=$("#cq");n.focus();n.setSelectionRange(pos,pos);};

/* ---- POAs ---- */
VIEW.poas=function(){const f=R.pf||"all";let list=S.poas.slice();const q=(R.pq||"").toLowerCase();
  const st=p=>{const d=daysTo(p.expires);return d==null?"":d<0?"ended":d<=30?"soon":"valid";};
  const cnt={all:list.length,valid:list.filter(p=>st(p)==="valid").length,soon:list.filter(p=>st(p)==="soon").length,ended:list.filter(p=>st(p)==="ended").length};
  if(f!=="all")list=list.filter(p=>st(p)===f);if(q)list=list.filter(p=>(p.no+" "+clientName(p.clientId)).toLowerCase().includes(q));

function nextOcc(e){if(!e.repeat||e.repeat==="none")return e.date;let d=e.date;const t=todayISO();let guard=0;
  while((d<t||(d===t&&dt(d,e.time)<new Date()))&&guard++<800)d=stepRepeat(d,e.repeat);return d;}
function stepRepeat(d,rep){if(rep==="daily")return addDays(d,1);if(rep==="weekly")return addDays(d,7);
  const x=new Date(d+"T12:00:00");const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return isoD(x);}
function remLabel(m){m=Number(m);if(!m)return"عند الموعد";if(m%1440===0)return m===1440?"قبل يوم":m===2880?"قبل يومين":`قبل ${m/1440} أيام`;if(m%60===0)return m===60?"قبل ساعة":m===120?"قبل ساعتين":`قبل ${m/60} ساعات`;return`قبل ${m} دقيقة`;}

/* Arabic natural-language parser */
function parseNL(raw){let t=String(raw).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g," ").trim();
  const r={kind:"موعد",title:"",person:"",place:"",date:todayISO(),time:"09:00",repeat:"none",remind:[60],note:raw};
  for(const[w,k]of[["جلسة صلح","جلسة صلح"],["جلسه صلح","جلسة صلح"],["جلسة","جلسة"],["اجتماع","اجتماع"],["زيارة","زيارة"],["اتصال","اتصال"],["مكالمة","اتصال"],["مهمة","مهمة"],["سداد","مهمة"],["موعد","موعد"]])if(t.includes(w)){r.kind=k;break;}
  const today=new Date(todayISO()+"T12:00:00");let d=null;
  if(/بعد\s*(بكرة|بكره|غد)/.test(t)){d=new Date(today);d.setDate(d.getDate()+2);}
  else if(/(بكرة|بكره|غدا|غدًا|غداً|الغد)/.test(t)){d=new Date(today);d.setDate(d.getDate()+1);}
  else if(/اليوم/.test(t))d=new Date(today);
  const DN=[["الأحد","الاحد"],["الاثنين","الإثنين","الأثنين"],["الثلاثاء","الثلاثا"],["الأربعاء","الاربعاء","الاربعا"],["الخميس"],["الجمعة","الجمعه"],["السبت"]];
  DN.forEach((names,i)=>{if(!d&&names.some(n=>t.includes(n))){d=new Date(today);const diff=(i-today.getDay()+7)%7;d.setDate(d.getDate()+diff);}});
  const dm=t.match(/يوم\s+(\d{1,2})(?!\s*[:.]\d)(?!\s*(?:ساعة|دقيقة|يوم|أيام))/);
  if(!d&&dm){const n=+dm[1];if(n>=1&&n<=31){d=new Date(today);if(n<today.getDate())d.setMonth(d.getMonth()+1);d.setDate(n);}}
  if(d)r.date=isoD(d);
  const tmm=t.match(/(?:الساعة|الساعه|ساعة)\s*(\d{1,2})(?:[:.](\d{2}))?/)||t.match(/\b(\d{1,2})[:.](\d{2})\b/);
  let H=null,M=0;if(tmm){H=+tmm[1];M=+(tmm[2]||0);}
  const pm=/(العصر|عصرا|عصرًا|المغرب|مغربا|مساء|مساءً|مساءا|الليل|ليلا|بالليل|\sم(\s|$)|الظهر|ظهرا|ظهرًا)/.test(" "+t+" ");
  const am=/(الصباح|صباحا|صباحًا|الصبح|الفجر|\sص(\s|$))/.test(" "+t+" ");
  if(H==null){if(/العصر/.test(t))H=16;else if(/المغرب/.test(t))H=18;else if(/الظهر/.test(t))H=12;else if(/الصباح|الصبح/.test(t))H=9;}
  else{if(pm&&H<12)H+=12;else if(!am&&!pm&&H>=1&&H<=6)H+=12;}
  if(H!=null)r.time=pad(Math.min(H,23))+":"+pad(Math.min(M,59));
  if(/كل\s*يوم|يوميا|يوميًا/.test(t))r.repeat="daily";else if(/كل\s*(أسبوع|اسبوع)|أسبوعيا|أسبوعيًا|اسبوعيا/.test(t))r.repeat="weekly";else if(/كل\s*شهر|شهريا|شهريًا/.test(t))r.repeat="monthly";
  const rm=t.match(/(?:ذكرني|ذكّرني|نبهني|نبّهني|ذكرني)\s*قبل\s*(.+?)(?:$|[،,.])/);
  if(rm){const s=rm[1];let m=null,x;
    if(/نصف\s*ساعة|نص\s*ساعة/.test(s))m=30;else if(/ربع\s*ساعة/.test(s))m=15;else if(/ساعتين/.test(s))m=120;else if((x=s.match(/(\d+)\s*(?:ساعات|ساعة)/)))m=+x[1]*60;else if(/ساعة/.test(s))m=60;
    else if((x=s.match(/(\d+)\s*(?:دقائق|دقيقة|دقايق)/)))m=+x[1];else if(/يومين/.test(s))m=2880;else if((x=s.match(/(\d+)\s*(?:أيام|ايام|يوم)/)))m=+x[1]*1440;else if(/يوم/.test(s))m=1440;else if(/أسبوع|اسبوع/.test(s))m=10080;
    if(m)r.remind=[m];}
  const STOP=["في","بكرة","بكره","غدا","غدًا","بعد","يوم","اليوم","الساعة","الساعه","ذكرني","ذكّرني","نبهني","كل","العصر","المغرب","الظهر","الصباح","مساء","مساءً","صباحا","صباحًا","عن","بخصوص"];
  const takeUntilStop=s=>{const out=[];for(const w of s.split(" ")){if(STOP.includes(w)||/^\d/.test(w))break;out.push(w);if(out.length>=4)break;}return out.join(" ").replace(/[،,.]$/,"");};
  const pi=t.indexOf("مع ");if(pi>-1)r.person=takeUntilStop(t.slice(pi+3));
  const plm=t.match(/(?:^|\s)(?:في|بـ?)\s+((?:ال|مقر|مكتب|محكمة|المحكمة|مستشفى)\S*.*)$/);if(plm)r.place=takeUntilStop(plm[1]);
  let head=t;const cut=head.search(/\s(مع|في|بكرة|بكره|غدا|بعد|يوم|اليوم|الساعة|ذكرني|كل)\s/);if(cut>0)head=head.slice(0,cut);
  r.title=r.kind==="مهمة"||head.split(" ").length>1?head:(r.kind+(r.person?" مع "+r.person:""));
  if(/^كل\s/.test(t)){const m2=t.match(/الساعة\s*\d{1,2}(?:[:.]\d{2})?\s+(.+)$/);if(m2)r.title=m2[1];}
  return r;}

function aiConv(caseId){S.ai=S.ai||{};return S.ai[caseId||"_"]=S.ai[caseId||"_"]||[];}
function bindAi(root,caseId){const send=async(text)=>{text=(text||$("#aiIn",root).value).trim();if(!text)return;if(!S.settings.apiKey){toast("أضف مفتاح API من الإعدادات","err");return;}
  const conv=aiConv(caseId);conv.push({role:"user",content:text});$("#aiIn",root).value="";const chat=$("#chat",root);
  chat.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(text)}</div><div class="msg a" id="aiWait">… جارٍ التفكير</div>`);chat.scrollTop=chat.scrollHeight;
  try{const ctx=await aiContext(caseId,root);const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.settings.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:S.settings.model||"claude-sonnet-5-5",max_tokens:4096,system:AI_SYS+"\n\n"+ctx,messages:conv.slice(-20).map(m=>({role:m.role,content:m.content}))})});
    const j=await res.json();if(!res.ok)throw new Error((j.error&&j.error.message)||res.status);
    const out=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");conv.push({role:"assistant",content:out});save();$("#aiWait").outerHTML=`<div class="msg a">${esc(out)}</div>`;}
  catch(e){conv.pop();$("#aiWait").outerHTML=`<div class="msg a" style="color:var(--bad)">تعذّر الاتصال: ${esc(e.message)}</div>`;}chat.scrollTop=chat.scrollHeight;};
  $("#aiSend",root).onclick=()=>send();$("#aiIn",root).onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))send();};root._aiSend=send;}
const AI_SYS=`أنت مساعد قانوني متخصص في الأنظمة السعودية تعمل داخل تطبيق «الحاجب المنصور القانوني» لمحامٍ سعودي.
القواعد: اكتب بالعربية الفصحى وبأسلوب قانوني رسمي. لا تختلق مواد نظامية أو أرقامها أو سوابق قضائية أو تواريخ؛ إن لم تكن متأكدًا من نص مادة أو رقمها فصرّح بذلك واطلب التحقق من هيئة الخبراء (laws.boe.gov.sa) أو وزارة العدل أو ديوان المظالم.
ميّز بين الحقيقة المؤكدة والاستنتاج. المخرجات مسودات للمراجعة. احسب المواعيد من البيانات المعطاة فقط ونبّه إلى أن المدد النظامية تختلف بحسب نوع الحكم والإجراء.`;
async function aiContext(caseId,root){const t=todayISO();if(!caseId){const up=allSessions().filter(s=>s.date>=t).slice(0,15);
    return"تاريخ اليوم: "+t+"\nملخص المكتب:\n- قضايا قيد النظر: "+S.cases.filter(c=>c.status==="open").length+"\n- الجلسات القادمة:\n"+up.map(s=>`  • ${s.date} ${s.time} — قضية ${s.c.no} (${s.c.court||""}) ${s.kind||""} — الموكل ${clientName(s.c.clientId)} ضد ${s.c.opponent||""}`).join("\n");}
  const c=getCase(caseId);const strip=o=>JSON.stringify(o,(k,v)=>["docs","id","caseId"].includes(k)?undefined:v,1);
  let s=`تاريخ اليوم: ${t}\nبيانات القضية:\n${strip({...c,clientName:clientName(c.clientId),category:CAT[c.cat||"najiz"]})}\nأسماء ملفات القضية: ${(c.docs||[]).map(d=>d.name).join("، ")||"لا يوجد"}`;
  if($("#aiFiles",root)&&$("#aiFiles",root).checked){for(const d of c.docs||[]){if(/\.(txt|md|csv|json)$/i.test(d.name)&&d.size<200000){try{const b=await getFile(d.id);s+=`\n\n--- محتوى الملف ${d.name} ---\n`+(await b.text());}catch(e){}}}}
  return s;}

function normDate(v){if(v==null||v==="")return"";if(v instanceof Date&&!isNaN(v))return isoD(v);const s=String(v).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));

function fired(){try{return JSON.parse(localStorage.getItem("hajib_fired")||"{}");}catch(e){return{};}}
function setFired(o){try{const now=Date.now();Object.keys(o).forEach(k=>{if(now-o[k]>864e5*3)delete o[k];});localStorage.setItem("hajib_fired",JSON.stringify(o));}catch(e){}}

  allSessions().forEach(s=>{if(s.status==="ended"||!s.time)return;const at=dt(s.date,s.time).getTime();mins.forEach(m=>{const k="s"+s.id+"_"+m+"_"+s.date+s.time;
    if(!f[k]&&now>=at-m*6e4&&now<at){f[k]=now;notify(`جلسة بعد ${m} دقيقة`,`قضية ${s.c.no} — ${s.c.court||""} — ${tm(s.time)}${s.virtual?" (مرئية)":""}`);}});});
  S.events.forEach(e=>{if(e.done)return;const d=nextOcc(e);const at=dt(d,e.time).getTime();(e.remind&&e.remind.length?e.remind:[0]).forEach(m=>{const k="e"+e.id+"_"+m+"_"+d;
    if(!f[k]&&now>=at-m*6e4&&now<at+6e4){f[k]=now;notify("السكرتير — تذكير",`${e.kind}: ${e.title} — ${both(d)} ${tm(e.time)}${e.place?" — "+e.place:""}`);}});});
  setFired(f);updateAlertN();}
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m);}

function buildICS(){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Hajib Mansour//AR","CALSCALE:GREGORIAN","X-WR-CALNAME:الحاجب المنصور القانوني","X-WR-TIMEZONE:Asia/Riyadh"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";const mins=String(S.settings.remindMins||"30").split(/[,،\s]+/).map(Number).filter(n=>n>0);const t=todayISO();
  const ev=(id,d,tm2,sum,loc,desc,alarms,rrule)=>{L.push("BEGIN:VEVENT","UID:"+id+"@hajib","DTSTAMP:"+stamp,"DTSTART;TZID=Asia/Riyadh:"+icsDT(d,tm2),"DURATION:PT1H","SUMMARY:"+icsEsc(sum));
    if(loc)L.push("LOCATION:"+icsEsc(loc));if(desc)L.push("DESCRIPTION:"+icsEsc(desc));if(rrule)L.push("RRULE:"+rrule);
    alarms.forEach(m=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(sum),"TRIGGER:-PT"+m+"M","END:VALARM"));L.push("END:VEVENT");};
  allSessions().filter(s=>s.date>=t&&s.status!=="ended").forEach(s=>ev("s"+s.id,s.date,s.time,`${s.kind||"جلسة"} — قضية ${s.c.no}`,(s.c.court||"")+(s.c.circuit?" — "+s.c.circuit:""),`${clientName(s.c.clientId)} ضد ${s.c.opponent||""}${s.link?"\nرابط الجلسة: "+s.link:""}`,mins));
  S.events.filter(e=>!e.done).forEach(e=>ev("e"+e.id,e.date,e.time,`${e.kind}: ${e.title}`,e.place,e.person?"مع "+e.person:"",(e.remind||[]).filter(m=>m>0),{daily:"FREQ=DAILY",weekly:"FREQ=WEEKLY",monthly:"FREQ=MONTHLY"}[e.repeat]));

/* lock */
async function reEncAll(oldK,newK){for(const k of await idbKeys("files")){const v=await idbGet("files",k);if(!v)continue;const plain=v.enc?await decBlob(oldK,v):v;await idbSet("files",k,newK?await encBlob(newK,plain):plain);}}

async function verify(pass){const m=await idbGet("kv","meta");const k=await deriveKey(pass,m.salt);try{await decObj(k,m.verifier);}catch(e){throw new Error("الرمز غير صحيح");}return k;}
async function setNewKey(pass,oldK){const salt=b64.enc(crypto.getRandomValues(new Uint8Array(16)));const k=await deriveKey(pass,salt);await reEncAll(oldK,k);KEY=k;
  await idbSet("kv","state",await encObj(KEY,S));await idbSet("kv","meta",{enc:true,salt,verifier:await encObj(KEY,"ok")});}
function setupLock(){passForm("تفعيل قفل الدخول والتشفير",[["p1","رمز جديد (٤ خانات فأكثر)"],["p2","تأكيد الرمز"]],async(g,close)=>{if(g("p1").length<4)throw new Error("الرمز قصير");if(g("p1")!==g("p2"))throw new Error("الرمزان غير متطابقين");await setNewKey(g("p1"),null);close();toast("فُعّل القفل والتشفير","ok");});}
function changePass(){passForm("تغيير الرمز",[["p0","الرمز الحالي"],["p1","الرمز الجديد"],["p2","تأكيد الجديد"]],async(g,close)=>{const old=await verify(g("p0"));if(g("p1").length<4||g("p1")!==g("p2"))throw new Error("الرمز الجديد غير صالح أو غير متطابق");await setNewKey(g("p1"),old);close();toast("تغيّر الرمز","ok");});}
function removeLock(){passForm("إلغاء القفل",[["p0","الرمز الحالي"]],async(g,close)=>{const old=await verify(g("p0"));await reEncAll(old,null);KEY=null;await idbSet("kv","state",S);await idbDel("kv","meta");close();toast("أُلغي القفل","ok");});}
